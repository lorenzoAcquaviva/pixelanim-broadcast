# Esempio di override per un'installazione dietro Traefik.
# Copiare in compose.local.yml e personalizzare host, middleware e rete.
services:
  pixelanim-broadcast:
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.pixelanim-broadcast.rule=Host(`broadcast.example.local`)"
      - "traefik.http.routers.pixelanim-broadcast.entrypoints=websecure"
      - "traefik.http.routers.pixelanim-broadcast.tls=true"
      - "traefik.http.services.pixelanim-broadcast.loadbalancer.server.port=9910"

networks:
  proxy:
    external: true
