services:
  pixelanim-broadcast:
    build: .
    container_name: pixelanim-broadcast
    restart: unless-stopped
    ports:
      - "${BROADCAST_PORT:-9910}:9910"
    environment:
      TZ: ${TZ:-Europe/Rome}
      PIXELANIM_URL: ${PIXELANIM_URL:-http://pixelanim:9900}
      PIXELANIM_WS: ${PIXELANIM_WS:-}
      RENDER_WORKERS: ${RENDER_WORKERS:-2}
      RENDER_MP_METHOD: ${RENDER_MP_METHOD:-fork}
      RENDER_CACHE_DISABLED: ${RENDER_CACHE_DISABLED:-0}
      RENDER_RESULT_MAX: ${RENDER_RESULT_MAX:-8}
      RENDER_RESULT_MAX_FRAMES: ${RENDER_RESULT_MAX_FRAMES:-24000}
      PALETTE_CACHE_TTL: ${PALETTE_CACHE_TTL:-30}
      LOG_FILE: ${LOG_FILE:-/data/pixelanim.log}
    volumes:
      - ./data:/data
